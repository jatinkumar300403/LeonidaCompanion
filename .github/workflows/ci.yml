name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 turns on caching from package.json's "packageManager" and then looks for
          # pnpm, which corepack only provides in the next step. CI runs without that cache.
          package-manager-cache: false

      # pnpm comes from corepack, pinned by "packageManager" in package.json (D-003).
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # No secrets here: missing integrations only hide features outside Vercel Production.
      - run: pnpm build
